# netlify.toml

# Always revalidate the shell HTML so it references *current* chunk names
[[headers]]
  for = "/index.html"
  [headers.values]
  Cache-Control = "no-cache"

# Common asset folders across bundlers — keep whichever you actually use.
# Vite (default): /assets/*
[[headers]]
  for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# CRA: /static/*
[[headers]]
  for = "/static/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Next.js (static assets): /_next/static/*
[[headers]]
  for = "/_next/static/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Keep your SPA redirect (adjust if you already have one)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200